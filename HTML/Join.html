<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NoiseCore/Join</title>
    <link rel="stylesheet" href="../CSS/Join.css" />
  </head>
  <body>
    <header class="head">
      <div class="logo">
        <img src="../Asset/Logo.png" alt="NoiseCore Logo" />
        <span>NoiseCore</span>
      </div>
      <nav class="navigation">
        <a href="Home.html">Home</a>
        <a href="Product.html">Products</a>
        <a href="About.html">About</a>
        <a href="Deals.html">Deals</a>
        <a href="Join.html">Join Membership</a>
      </nav>
      <div class="account">
        <img src="../Asset/Cart.png" alt="Cart" />
        <img src="../Asset/Account.png" alt="Account" />
      </div>
    </header>

    <h1>Registration Form</h1>

    <form action="" method="post" id="form">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" />

      <br /><br />

      <label for="email">Email</label>
      <input type="text" name="email" id="email" />

      <br /><br />
      <label for="gender">Gender</label>
      <input type="radio" name="gender" id="male" /> Male
      <input type="radio" name="gender" id="female" /> Female

      <br /><br />
      <label for="dob">Date</label>
      <input type="date" name="dob" id="dob" />

      <br /><br />
      <label for="password">Password</label>
      <input type="password" name="password" id="password" />

      <br /><br />
      <input type="checkbox" name="agreement" id="agreement" />
      I agree with the terms and conditions.

      <br /><br />
      <button type="submit">Submit</button>
    </form>

    <footer class="site-footer">
      <div class="footer-content">
        <div class="footer-logo">
          <img src="../Asset/Logo.png" alt="NoiseCore Logo" />
          <span>NoiseCore</span>
        </div>
        <div class="footer-links">
          <a href="Home.html">Home</a>
          <a href="Product.html">Products</a>
          <a href="About.html">About</a>
          <a href="Deals.html">Deals</a>
          <a href="Join.html">Join</a>
        </div>
        <div class="footer-info">
          <p>&copy; 2025 NoiseCore. All rights reserved.</p>
        </div>
      </div>
    </footer>

    <script src="../JS/Join.js"></script>
  </body>
</html>
